# Roles, scopes, and users. Passwords are never stored here; each user names the
# environment variable that holds their password.
# Scope names and factory IDs must match the supplied data (support-data/config/users.csv)
# and the retrieval layer's known scopes.

[roles.viewer]
scopes = ["public"]

[roles.procurement_manager]
scopes = ["public", "internal", "procurement"]

[roles.finance_controller]
scopes = ["public", "internal", "procurement", "finance-confidential"]

[[users]]
id = "u-ro-01"
display_name = "Viewer"
role = "viewer"
password_env = "AUTH_PASSWORD_U_RO_01"

[[users]]
id = "u-pm-01"
display_name = "Procurement Manager"
role = "procurement_manager"
factory_ids = ["F1", "F2", "F3"]
password_env = "AUTH_PASSWORD_U_PM_01"

[[users]]
id = "u-fin-01"
display_name = "Finance Controller"
role = "finance_controller"
factory_ids = ["F1", "F2", "F3"]
password_env = "AUTH_PASSWORD_U_FIN_01"
