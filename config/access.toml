# Roles, scopes, and users. Passwords are never stored here; each user names the
# environment variable that holds their password.
# Base users match support-data/config/users.csv. The demo Finance Director is an app extension.

[roles.viewer]
scopes = ["public"]

[roles.operations_analyst]
scopes = ["public", "internal", "procurement"]

[roles.incident_coordinator]
scopes = ["public", "internal", "procurement"]

[roles.procurement_manager]
scopes = ["public", "internal", "procurement"]

[roles.finance_controller]
scopes = ["public", "internal", "procurement", "finance-confidential"]

[roles.finance_director]
scopes = ["public", "internal", "procurement", "finance-confidential"]

